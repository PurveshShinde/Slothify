    <style>
        :root,
        html[data-theme="ocean"],
        html.theme-ocean {
            --accent-color: #3b82f6;
            --selection-bg: #2563eb;
            --selection-color: #ffffff;
            --bg-midnight: #040e1a;
        }

        html[data-theme="autumn"],
        html.theme-autumn {
            --accent-color: #c87d46;
            --accent-peach: #f5d0b5;
            --accent-peach-hover: #ebd0bc;
            --selection-bg: #c87d46;
            --selection-color: #ffffff;
            --bg-midnight: #120905;
        }

        .font-serif-display {
            font-family: 'Playfair Display', Georgia, serif;
        }

        /* Global smooth scrolling and scrollbar hiding */
        * {
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }

        *::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::selection {
            background-color: var(--selection-bg, #2563eb);
            color: var(--selection-color, #ffffff);
        }

        /* Ocean theme selection */
        html[data-theme="ocean"] ::selection,
        html.theme-ocean ::selection,
        html[data-theme="ocean"] input::selection,
        html.theme-ocean input::selection,
        html[data-theme="ocean"] textarea::selection,
        html.theme-ocean textarea::selection {
            background-color: #2563eb !important;
            color: #ffffff !important;
        }

        /* Autumn theme selection */
        html[data-theme="autumn"] ::selection,
        html.theme-autumn ::selection,
        html[data-theme="autumn"] input::selection,
        html.theme-autumn input::selection,
        html[data-theme="autumn"] textarea::selection,
        html.theme-autumn textarea::selection {
            background-color: #c87d46 !important;
            color: #ffffff !important;
        }

        .accent-bg {
            background-color: var(--accent-color);
        }

        .accent-text {
            color: var(--accent-color);
        }

        .accent-border {
            border-color: var(--accent-color);
        }

        .accent-ring:focus {
            --tw-ring-color: var(--accent-color);
        }

        /* Minimalist Range Styling */
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid var(--accent-color);
            margin-top: -4px;
            transition: transform 0.1s ease;
        }

        .pb-safe {
            padding-bottom: calc(env(safe-area-inset-bottom) + 5rem);
        }

        /* Home Layout specifics */
        .card-shadow {
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6);
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
